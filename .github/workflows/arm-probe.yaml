name: OCV PR Windows

on:
  workflow_dispatch:
  push:
    branches:
      - issue/ppl

concurrency:
  group: OCV-PR-Windows-${{ github.ref }}
  cancel-in-progress: true

jobs:

  Windows:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        arch: [ arm64 ]
        config: [ base ]
        include:
          - arch: arm64
            config: base
            runner: windows-11-arm
            vs: 'Visual Studio 17 2022'
            cmake_arch: ARM64
            no_opencl: true
    defaults:
      run:
        shell: bash
    env:
      CMAKE_OPT: >-
        -DCL_Z_OPTION=/Z7
        -DBUILD_EXAMPLES=ON
        -DOPENCV_ENABLE_NONFREE=ON
        -DCMAKE_BUILD_TYPE=Release
        ${{ matrix.no_opencl && '-DWITH_OPENCL=OFF' || '' }}
        -DCMAKE_ASM_COMPILER=CMAKE_ASM_COMPILER-NOTFOUND
        -DBUILD_opencv_python3=OFF
        -DBUILD_opencv_python_bindings_generator=OFF
      MAIN_BUILD_DIR: 'build'
      OPENCV_FOR_THREADS_NUM: 8
      CMAKE_BUILD_PARALLEL_LEVEL: 8

    # ==========

    steps:

    - name: Runner hardware
      shell: pwsh
      run: |
        Get-CimInstance Win32_Processor |
          Select-Object Name, Manufacturer, NumberOfCores, NumberOfLogicalProcessors, MaxClockSpeed, L2CacheSize, L3CacheSize |
          Format-List
        Get-CimInstance Win32_ComputerSystem |
          Select-Object Manufacturer, Model, NumberOfProcessors, NumberOfLogicalProcessors, TotalPhysicalMemory |
          Format-List
        Get-CimInstance Win32_OperatingSystem |
          Select-Object Caption, Version, BuildNumber, OSArchitecture |
          Format-List
        "PROCESSOR_IDENTIFIER = $env:PROCESSOR_IDENTIFIER"
        "NUMBER_OF_PROCESSORS = $env:NUMBER_OF_PROCESSORS"

    - name: Toolchain on PATH
      run: |
        cmake --version
        which cc || echo "no cc on PATH"
        which gcc || echo "no gcc on PATH"

    - name: Checkout workflow repository
      uses: actions/checkout@v4
      with:
        repository: opencv/ci-gha-workflow
        ref: 'as/windows_arm'

    - name: Checkout OpenCV
      uses: actions/checkout@v4
      with:
        repository: SavyaSanchi-Sharma/opencv
        ref: issue/ppl
        path: opencv
        fetch-depth: 0

    - name: Checkout opencv_extra
      uses: actions/checkout@v4
      with:
        repository: opencv/opencv_extra
        ref: 5.x
        path: opencv_extra
        fetch-depth: 1

    - name: Confirm what is being built
      working-directory: opencv
      run: |
        git log -1 --format='%H %s'
        git describe --tags || echo "no tags in fork"
        git status --short --branch

    - name: Configure and build OpenCV
      uses: ./configure-and-build
      with:
        workdir: '${{ github.workspace }}'
        builddir: 'build'
        generator: '${{ matrix.vs }}'
        options: '-A ${{ matrix.cmake_arch }} ${{ env.CMAKE_OPT }}'

    - name: Verify MSVC build
      run: |
        f=$(find . -name version_string.inc | head -1)
        echo "build info: $f"
        grep -E "CMake generator|C\+\+ Compiler|MSVC|Parallel framework" "$f" || true

    - name: Run OpenCV tests
      uses: ./run-tests
      env:
        OPENCV_TEST_DATA_PATH: '${{ github.workspace }}/opencv_extra/testdata'
        OPENCV_TEST_REQUIRE_DATA: 1
        OPENCV_TEST_CHECK_OPTIONAL_DATA: 0
        PYTHONPATH: '${{ github.workspace }}/${{ env.MAIN_BUILD_DIR }}/python_loader:$PYTHONPATH'
        OPENCV_OPENCL_RUNTIME: 'disabled'
      with:
        workdir: '${{ github.workspace }}'
        builddir: '${{ env.MAIN_BUILD_DIR }}'
        logdir: '${{ github.workspace }}'
        plan: "test-plan-win-5.x.json"
        suite: "[ 'main' ]"
        enable_python: "false"
        enable_java: "false"
        filter: "[ 'windows-common' ]"
        suffix: 'arm64_5.x'
        timeout: 15

    - if: ${{ always() && env.WARNINGS == '1' }}
      name: Warnings check
      run: |
        echo "::error Warnings have been found!"
        exit 1
